server {
    listen 80;
    listen [::]:80;
    server_name realms.happymonkey.ai;

    location ~ /\\.(env|git) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name realms.happymonkey.ai;

    ssl_certificate /etc/letsencrypt/live/realms.happymonkey.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realms.happymonkey.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\\.(?!well-known) {
        deny all;
    }

    location = /health {
        proxy_pass http://127.0.0.1:9412/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:9412/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        root /home/stephen/projects/MRPGRealms/client/dist;
        try_files $uri $uri/ /index.html;
    }

    location ~* \\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /home/stephen/projects/MRPGRealms/client/dist;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    access_log /var/log/nginx/realms.happymonkey.ai_access.log;
    error_log /var/log/nginx/realms.happymonkey.ai_error.log;
}
